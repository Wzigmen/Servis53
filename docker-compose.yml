version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: servis53-db
    restart: always

    environment:
      POSTGRES_DB: Servis53
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 228228228

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./servis53.sql:/docker-entrypoint-initdb.d/servis53.sql

  backend:
    build: ./Backend/UserManagerApi
    container_name: servis53-backend

    depends_on:
      - postgres

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=Servis53;Username=postgres;Password=228228228

    ports:
      - "5263:8080"

  frontend:
    build: ./Frontend/servis53Front
    container_name: servis53-frontend

    depends_on:
      - backend

    ports:
      - "5173:80"

  telegrambot:
    build: ./TelegramBot
    container_name: servis53-bot

    ports:
      - "5001:5001"

    depends_on:
      - backend

    restart: always

volumes:
  postgres_data:
